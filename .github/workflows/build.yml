name: Compilar BhopSurf
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          unzip -q "$(ls *.zip | head -1)"
          cd BhopSurf
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" bash build_termux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libBhopSurf
          path: BhopSurf/out/libBhopSurf.so
